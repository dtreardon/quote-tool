<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuoteSheetPRO</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      background: #faf8f4;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #d0cdc8;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(51,78,133,0.10);
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 20px;
    }
    .status-icon {
      font-size: 36px;
      margin-bottom: 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d0cdc8;
      border-top-color: #334e85;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      font-size: 14px;
      font-weight: 600;
      color: #334e85;
      margin-bottom: 6px;
    }
    .status-sub {
      font-size: 12px;
      color: #888;
      line-height: 1.4;
    }
    .error-text {
      font-size: 13px;
      color: #c0504d;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .btn-retry {
      background: #334e85;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-retry:hover { background: #4a6aaa; }
    .check { color: #2e7d32; font-size: 36px; margin-bottom: 12px; }
    .gold-bar {
      height: 3px;
      background: linear-gradient(90deg, #c8922a, #e8b44a, #c8922a);
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://quotesheetpro.com/logo-blue.png" alt="Robinson &amp; Associates" class="logo" onerror="this.style.display='none'" />
    <div class="gold-bar"></div>
    <div id="content">
      <!-- filled by JS -->
    </div>
    <div class="footer">QuoteSheetPRO &mdash; Reardon Insurance, LLC</div>
  </div>

  <script>
    var BASE_URL = 'https://quotesheetpro.com';

    function showSending() {
      document.getElementById('content').innerHTML =
        '<div class="spinner"></div>' +
        '<div class="status-text">Sending to QuoteSheetPRO&hellip;</div>' +
        '<div class="status-sub">Reading email and extracting data.<br>This may take a few seconds.</div>';
    }

    function showSuccess(uuid) {
      document.getElementById('content').innerHTML =
        '<div class="check">&#10003;</div>' +
        '<div class="status-text">Ready!</div>' +
        '<div class="status-sub">Opening your quote sheet&hellip;</div>';
      // Open in browser window (works in New Outlook and Outlook on the web)
      var url = BASE_URL + '/?session=' + encodeURIComponent(uuid);
      try {
        Office.context.ui.openBrowserWindow(url);
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    function showError(msg) {
      document.getElementById('content').innerHTML =
        '<div class="status-icon">⚠️</div>' +
        '<div class="error-text">' + escapeHtml(msg || 'Something went wrong. Please try again.') + '</div>' +
        '<button class="btn-retry" onclick="startProcessing()">Retry</button>';
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function getBodyAsync(item) {
      return new Promise(function(resolve, reject) {
        item.body.getAsync(Office.CoercionType.Text, function(result) {
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            resolve(result.value || '');
          } else {
            reject(new Error(result.error ? result.error.message : 'Could not read email body'));
          }
        });
      });
    }

    function getAttachmentContentAsync(item, id) {
      return new Promise(function(resolve) {
        item.getAttachmentContentAsync(id, function(result) {
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            resolve(result.value);
          } else {
            resolve(null);
          }
        });
      });
    }

    async function getInlineImages(item) {
      var images = [];
      var attachments = item.attachments || [];
      var inlineAtts = attachments.filter(function(a) {
        return a.isInline === true;
      });
      for (var i = 0; i < inlineAtts.length; i++) {
        var att = inlineAtts[i];
        try {
          var content = await getAttachmentContentAsync(item, att.id);
          if (content && content.content) {
            var mediaType = att.contentType || 'image/jpeg';
            // Only send image types (skip non-image inline attachments)
            if (mediaType.startsWith('image/')) {
              images.push({ mediaType: mediaType, data: content.content });
            }
          }
        } catch (e) {
          // Skip this attachment if we can't read it
        }
      }
      return images;
    }

    async function startProcessing() {
      showSending();
      try {
        var item = Office.context.mailbox.item;

        var body = await getBodyAsync(item);

        var fromName  = (item.from && item.from.displayName)  || '';
        var fromEmail = (item.from && item.from.emailAddress) || '';

        var images = [];
        try {
          images = await getInlineImages(item);
        } catch (e) {
          // Inline images are best-effort; proceed without them
        }

        var payload = {
          text:       body,
          images:     images,
          from_name:  fromName,
          from_email: fromEmail
        };

        var res = await fetch(BASE_URL + '/api/autofill/session', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload)
        });

        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || ('Server error ' + res.status));
        }

        var data = await res.json();
        if (!data.uuid) throw new Error('No session ID returned from server.');

        showSuccess(data.uuid);
      } catch (e) {
        showError(e && e.message ? e.message : String(e));
      }
    }

    Office.onReady(function(info) {
      if (info.host === Office.HostType.Outlook) {
        startProcessing();
      } else {
        showError('This add-in must be opened from Outlook.');
      }
    });
  </script>
</body>
</html>
